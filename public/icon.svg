<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm wood background gradient -->
    <linearGradient id="woodBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d99a55"/>
      <stop offset="100%" stop-color="#b9763a"/>
    </linearGradient>
    <!-- Car body gradient for depth -->
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f04040"/>
      <stop offset="100%" stop-color="#c52020"/>
    </linearGradient>
    <!-- Cabin gradient -->
    <linearGradient id="cabin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e85050"/>
      <stop offset="100%" stop-color="#c03030"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="wheel" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <!-- Rounded square clip -->
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
    <!-- Shadow filter for car -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6b3a0a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background: warm wood rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#woodBg)"/>

  <!-- Wood grain texture (subtle horizontal lines) -->
  <g clip-path="url(#rounded)" opacity="0.08">
    <line x1="0" y1="80" x2="512" y2="72" stroke="#7a4010" stroke-width="4"/>
    <line x1="0" y1="140" x2="512" y2="135" stroke="#7a4010" stroke-width="3"/>
    <line x1="0" y1="200" x2="512" y2="208" stroke="#7a4010" stroke-width="5"/>
    <line x1="0" y1="260" x2="512" y2="255" stroke="#7a4010" stroke-width="3"/>
    <line x1="0" y1="320" x2="512" y2="328" stroke="#7a4010" stroke-width="4"/>
    <line x1="0" y1="380" x2="512" y2="374" stroke="#7a4010" stroke-width="3"/>
    <line x1="0" y1="440" x2="512" y2="445" stroke="#7a4010" stroke-width="5"/>
  </g>

  <!-- ===== TOY CAR (center, slightly side-on) ===== -->
  <g filter="url(#shadow)">

    <!-- Car body (chunky, rounded rectangle) -->
    <rect x="88" y="272" width="320" height="96" rx="22" ry="22" fill="url(#carBody)"/>

    <!-- Front bumper bulge -->
    <rect x="370" y="290" width="28" height="60" rx="14" ry="14" fill="#c52020"/>

    <!-- Rear bumper -->
    <rect x="112" y="292" width="20" height="56" rx="10" ry="10" fill="#c52020"/>

    <!-- Cabin (sits on body) -->
    <rect x="148" y="192" width="210" height="96" rx="24" ry="24" fill="url(#cabin)"/>

    <!-- Windshield (front window) -->
    <rect x="302" y="206" width="46" height="64" rx="10" ry="10" fill="#a8d8f0" opacity="0.85"/>
    <!-- Windshield glare -->
    <rect x="308" y="212" width="14" height="22" rx="5" ry="5" fill="white" opacity="0.5"/>

    <!-- Rear window -->
    <rect x="162" y="206" width="40" height="60" rx="10" ry="10" fill="#a8d8f0" opacity="0.75"/>

    <!-- Side window -->
    <rect x="210" y="206" width="82" height="60" rx="10" ry="10" fill="#b8e0f4" opacity="0.70"/>

    <!-- Door detail (subtle line) -->
    <line x1="252" y1="272" x2="252" y2="360" stroke="#b02020" stroke-width="3" opacity="0.5"/>

    <!-- WHEELS -->
    <!-- Front wheel (right) -->
    <circle cx="348" cy="376" r="48" fill="url(#wheel)"/>
    <circle cx="348" cy="376" r="32" fill="#333"/>
    <circle cx="348" cy="376" r="18" fill="#999"/>
    <circle cx="348" cy="376" r="8" fill="#ccc"/>
    <!-- Wheel bolts front -->
    <circle cx="348" cy="352" r="4" fill="#888"/>
    <circle cx="348" cy="400" r="4" fill="#888"/>
    <circle cx="324" cy="376" r="4" fill="#888"/>
    <circle cx="372" cy="376" r="4" fill="#888"/>

    <!-- Rear wheel (left) -->
    <circle cx="162" cy="376" r="48" fill="url(#wheel)"/>
    <circle cx="162" cy="376" r="32" fill="#333"/>
    <circle cx="162" cy="376" r="18" fill="#999"/>
    <circle cx="162" cy="376" r="8" fill="#ccc"/>
    <!-- Wheel bolts rear -->
    <circle cx="162" cy="352" r="4" fill="#888"/>
    <circle cx="162" cy="400" r="4" fill="#888"/>
    <circle cx="138" cy="376" r="4" fill="#888"/>
    <circle cx="186" cy="376" r="4" fill="#888"/>

    <!-- Headlight -->
    <ellipse cx="394" cy="306" rx="14" ry="10" fill="#ffe0a0" opacity="0.95"/>
    <ellipse cx="394" cy="306" rx="8" ry="6" fill="white" opacity="0.7"/>

    <!-- Tail light -->
    <ellipse cx="100" cy="308" rx="12" ry="8" fill="#ff6666" opacity="0.9"/>

  </g>

  <!-- ===== HORN SOUND WAVES (tu-tu motif, front of car) ===== -->
  <!-- Arc 1 (closer) -->
  <path d="M 432 240 Q 460 270 432 300" stroke="white" stroke-width="10" fill="none"
        stroke-linecap="round" opacity="0.85"/>
  <!-- Arc 2 (farther) -->
  <path d="M 452 218 Q 492 258 452 298" stroke="white" stroke-width="8" fill="none"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Rounded corner overlay to ensure crisp edges -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96"
        fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d4a8"/>
      <stop offset="100%" stop-color="#d4a860"/>
    </linearGradient>
    <linearGradient id="fg-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f04040"/>
      <stop offset="100%" stop-color="#c52020"/>
    </linearGradient>
    <radialGradient id="fg-wheel" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
  </defs>

  <!-- Background: warm cream rounded square -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="url(#fg-bg)"/>

  <!-- Car body -->
  <rect x="8" y="34" width="46" height="14" rx="4" ry="4" fill="url(#fg-car)"/>

  <!-- Cabin -->
  <rect x="16" y="22" width="28" height="14" rx="5" ry="5" fill="#e23b3b"/>

  <!-- Windshield -->
  <rect x="38" y="24" width="5" height="10" rx="2" ry="2" fill="#b8e0f4" opacity="0.9"/>

  <!-- Rear window -->
  <rect x="18" y="24" width="5" height="10" rx="2" ry="2" fill="#b8e0f4" opacity="0.8"/>

  <!-- Front bumper -->
  <rect x="50" y="36" width="5" height="10" rx="3" ry="3" fill="#c52020"/>

  <!-- Headlight -->
  <ellipse cx="54" cy="40" rx="3" ry="2" fill="#ffe0a0" opacity="0.95"/>

  <!-- Front wheel -->
  <circle cx="44" cy="50" r="7" fill="url(#fg-wheel)"/>
  <circle cx="44" cy="50" r="4" fill="#555"/>
  <circle cx="44" cy="50" r="2" fill="#aaa"/>

  <!-- Rear wheel -->
  <circle cx="18" cy="50" r="7" fill="url(#fg-wheel)"/>
  <circle cx="18" cy="50" r="4" fill="#555"/>
  <circle cx="18" cy="50" r="2" fill="#aaa"/>

  <!-- Horn sound arc (small, near front) -->
  <path d="M 57 30 Q 63 36 57 42" stroke="white" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.8"/>
</svg>
